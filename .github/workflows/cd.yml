name: CD

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  TF_WORKING_DIR: terraform
  ARM_CLIENT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientId }}
  ARM_CLIENT_SECRET: ${{ fromJson(secrets.AZURE_CREDENTIALS).clientSecret }}
  ARM_SUBSCRIPTION_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).subscriptionId }}
  ARM_TENANT_ID: ${{ fromJson(secrets.AZURE_CREDENTIALS).tenantId }}

jobs:
  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    environment: dev
    # Serialize with other runs touching the same remote state (no lock clash).
    concurrency:
      group: tf-state-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Init
        run: |
          terraform init \
            -backend-config="use_azuread_auth=true" \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=weather.dev.tfstate"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan

      - name: Build and push image
        run: |
          ACR=$(terraform output -raw acr_login_server)
          az acr login --name "${ACR%%.*}"
          docker build -t "$ACR/weather-dashboard:latest" ..
          docker push "$ACR/weather-dashboard:latest"

      - name: Restart app
        run: |
          APP=$(terraform output -raw app_url | sed 's|https://||; s|\..*||')
          az webapp restart --name "$APP" --resource-group "$(terraform output -raw resource_group_name)"

  # Manual approval gate (GitHub environment "prod" required reviewer).
  # Re-applies the validated plan on the same stack (no second stack / no extra cost).
  deploy-prod:
    name: Deploy prod (manual gate)
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment: prod
    # Serialize with other runs touching the same remote state (no lock clash).
    concurrency:
      group: tf-state-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Init
        run: |
          terraform init \
            -backend-config="use_azuread_auth=true" \
            -backend-config="resource_group_name=${{ secrets.TFSTATE_RG }}" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_SA }}" \
            -backend-config="container_name=${{ secrets.TFSTATE_CONTAINER }}" \
            -backend-config="key=weather.dev.tfstate"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
